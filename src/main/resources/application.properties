spring.application.name=toy-robot
server.port=${PORT:8000}
spring.jackson.deserialization.fail-on-trailing-tokens=true

# Spring Boot Actuator: health (with liveness/readiness probes) and info only.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# OpenAPI docs: JSON at /v3/api-docs, Swagger UI at /swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.default-produces-media-type=application/json
# Document each endpoint's own error responses only, not every @ExceptionHandler on every endpoint.
springdoc.override-with-generic-response=false
# Include the Actuator health endpoints in the spec so it lists every endpoint the app exposes.
springdoc.show-actuator=true

# Logging: every line carries the request id. Set the app package to DEBUG to trace each command.
logging.pattern.level=%5p [%X{requestId:-no-request}]
logging.level.com.example.toyrobot=INFO
